name: Poll Federal RSS

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Poll RSS feeds
        run: python poll_federal_rss.py

      - name: Build dashboards
        run: python build_federal_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ edpa.html
          git diff --staged --quiet || git commit -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
